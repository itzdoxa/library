<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="script.js" defer></script>

</head>
<body>

    <dialog id="form-dialog">
        <form>
            <button id="close-form-btn" type="button">
                <img src="img/close.svg" alt="close-form">
            </button>

                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>

                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>

                <label for="pages">Pages:</label>
                <input type="number" id="pages" name="pages" required>

            <fieldset>
                <legend>Reading status:</legend>
                    <label for="read">read</label>
                    <input type="radio" id="read" name="reading-status" value="read">
                    <label for="not-read">not-read</label>
                    <input type="radio" id="not-read" name="reading-status" value="not-read" checked>
            </fieldset>

            <button type="submit" id="submit-form-btn">Submit</button>
        </form>
        <button id="reset-form-btn" type="reset">Clear</button>
    </dialog>

    <button id="add-book-btn">Add book</button>

    <div id="library-container"></div>
    
</body>
</html>
